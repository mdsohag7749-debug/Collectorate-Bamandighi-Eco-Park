<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Firebase Contact Form Handler</title>
</head>
<body>
  <!-- This file integrates Firebase with Contact Form -->
  <script type="module">
    // Import Firebase functions
    import { 
      addContact 
    } from './firebase-config.js';

    // Make it globally available
    window.submitContactToFirebase = async function (e) {
      e.preventDefault();

      const name = document.getElementById('form-name').value.trim();
      const phone = document.getElementById('form-phone').value.trim();
      const email = document.getElementById('form-email').value.trim();
      const subject = document.getElementById('form-subject').value ||
                      document.getElementById('form-subject').options[0].textContent;
      const message = document.getElementById('form-message').value.trim();

      // Validation
      if (!name || !message) {
        alert('নাম এবং বার্তা আবশ্যক!');
        return;
      }

      const btn = document.getElementById('form-submit');
      btn.disabled = true;
      btn.style.opacity = '0.7';
      btn.innerHTML = '<span>⏳</span> <span>পাঠানো হচ্ছে...</span>';

      try {
        const result = await addContact({
          name,
          phone,
          email,
          subject,
          message,
          ipAddress: 'web-user'
        });

        if (result.success) {
          document.getElementById('contact-form').reset();
          showToast(result.message);
        } else {
          alert(result.message);
        }
      } catch (error) {
        console.error('Error submitting form:', error);
        alert('বার্তা পাঠাতে ব্যর্থ হয়েছে');
      } finally {
        btn.disabled = false;
        btn.style.opacity = '1';
        btn.innerHTML = '<span>📨</span> <span id="submit-text">বার্তা পাঠান</span>';
      }
    };

    function showToast(message) {
      const toast = document.getElementById('success-toast');
      const msgEl = document.getElementById('toast-msg');
      if (message) {
        msgEl.textContent = message;
      }
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 4000);
    }
  </script>
</body>
</html>
